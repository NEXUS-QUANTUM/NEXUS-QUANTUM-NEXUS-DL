# ==========================================================================
#  NexusDL 2.0 - Nginx Configuration
#  Fichier : frontend/nginx.conf
#  Description : Configuration serveur Nginx pour l'interface Vue.js 3
#  Version : 2.0.0
# ==========================================================================

# --------------------------------------------------------------------------
#  Configuration principale
# --------------------------------------------------------------------------

# Utilisateur et groupe
user nginx nginx;

# Nombre de workers (automatique)
worker_processes auto;

# PID file
pid /var/run/nginx.pid;

# Log d'erreur
error_log /var/log/nginx/error.log warn;

# --------------------------------------------------------------------------
#  Événements
# --------------------------------------------------------------------------

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

# --------------------------------------------------------------------------
#  HTTP
# --------------------------------------------------------------------------

http {
    # ----------------------------------------------------------------------
    #  Types MIME
    # ----------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------------------------------------------------------
    #  Logging
    # ----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ----------------------------------------------------------------------
    #  Paramètres de base
    # ----------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;
    client_max_body_size 100M;
    server_tokens off;

    # ----------------------------------------------------------------------
    #  Compression Gzip
    # ----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/ld+json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # ----------------------------------------------------------------------
    #  Limites de taille
    # ----------------------------------------------------------------------
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ----------------------------------------------------------------------
    #  Cache des fichiers statiques
    # ----------------------------------------------------------------------
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ----------------------------------------------------------------------
    #  Upstream pour le backend (FastAPI)
    # ----------------------------------------------------------------------
    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ----------------------------------------------------------------------
    #  Serveur principal
    # ----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ------------------------------------------------------------------
        #  Dossier racine
        # ------------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        # ------------------------------------------------------------------
        #  Gestion des assets statiques (cache permanent)
        # ------------------------------------------------------------------
        location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        location ~* ^/assets/.*\.(json|xml|txt)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # ------------------------------------------------------------------
        #  Robots.txt
        # ------------------------------------------------------------------
        location = /robots.txt {
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # ------------------------------------------------------------------
        #  Favicon
        # ------------------------------------------------------------------
        location = /favicon.ico {
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # ------------------------------------------------------------------
        #  Manifest PWA
        # ------------------------------------------------------------------
        location = /manifest.json {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            log_not_found off;
        }

        # ------------------------------------------------------------------
        #  Healthcheck (pour Docker)
        # ------------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        #  API Proxy vers le backend
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;
            proxy_redirect off;

            # Headers CORS pour l'API (si backend ne les gère pas)
            # add_header 'Access-Control-Allow-Origin' '*' always;
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            # if ($request_method = 'OPTIONS') {
            #     add_header 'Access-Control-Max-Age' 1728000;
            #     add_header 'Content-Type' 'text/plain; charset=utf-8';
            #     add_header 'Content-Length' 0;
            #     return 204;
            # }
        }

        # ------------------------------------------------------------------
        #  Documentation API
        # ------------------------------------------------------------------
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        #  Websocket (pour les mises à jour en temps réel)
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        #  SPA Fallback (toutes les autres routes)
        # ------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ------------------------------------------------------------------
        #  Gestion des erreurs
        # ------------------------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ------------------------------------------------------------------
        #  Headers de sécurité
        # ------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # HSTS (uniquement en HTTPS)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # CSP (ajuster selon les besoins)
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://backend:8000; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }

    # ------------------------------------------------------------------
    #  Serveur HTTPS (exemple, commenté)
    # ------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/nexusdl.crt;
    #     ssl_certificate_key /etc/nginx/ssl/nexusdl.key;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     # Les mêmes locations que ci-dessus...
    #
    #     error_page 404 /index.html;
    # }

    # ------------------------------------------------------------------
    #  Inclusion des fichiers de configuration supplémentaires
    # ------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
