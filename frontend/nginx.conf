# ==========================================================================
#  NexusDL 2.0 - Nginx Configuration (version complète)
#  Fichier : frontend/nginx.conf
#  Description : Configuration Nginx ultra-complète pour servir le frontend
#                Vue.js 3 et proxy vers le backend FastAPI.
#  Version : 2.0.0
# ==========================================================================

# --------------------------------------------------------------------------
#  Configuration globale
# --------------------------------------------------------------------------

# Utilisateur et groupe (défini dans l'image alpine)
user  nginx;

# Nombre de workers (auto = nombre de CPU disponibles)
worker_processes  auto;

# Fichier PID
pid  /var/run/nginx.pid;

# Log d'erreur global
error_log  /var/log/nginx/error.log  warn;

# --------------------------------------------------------------------------
#  Événements
# --------------------------------------------------------------------------

events {
    # Nombre maximum de connexions simultanées par worker
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

# --------------------------------------------------------------------------
#  HTTP
# --------------------------------------------------------------------------

http {
    # ----------------------------------------------------------------------
    #  Types MIME
    # ----------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------------------
    #  Format de log personnalisé
    # ----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
          '"time_local":"$time_local",'
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"request":"$request",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"http_referrer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    # ----------------------------------------------------------------------
    #  Logs d'accès
    # ----------------------------------------------------------------------
    access_log  /var/log/nginx/access.log  main  buffer=32k flush=5s;

    # ----------------------------------------------------------------------
    #  Paramètres de performance
    # ----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  100;
    client_body_timeout     60s;
    client_header_timeout   60s;
    send_timeout            60s;
    server_tokens           off;

    # ----------------------------------------------------------------------
    #  Limites de taille
    # ----------------------------------------------------------------------
    client_max_body_size        100M;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    # ----------------------------------------------------------------------
    #  Cache des fichiers statiques
    # ----------------------------------------------------------------------
    open_file_cache          max=2000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ----------------------------------------------------------------------
    #  Compression Gzip
    # ----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        application/font-woff
        application/font-woff2
        image/svg+xml
        image/x-icon
        font/opentype
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ----------------------------------------------------------------------
    #  Compression Brotli (si module disponible)
    # ----------------------------------------------------------------------
    # brotli              on;
    # brotli_comp_level   6;
    # brotli_static       on;
    # brotli_types        text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ----------------------------------------------------------------------
    #  Cache proxy (pour les assets)
    # ----------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    # ----------------------------------------------------------------------
    #  Rate Limiting
    # ----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    # ----------------------------------------------------------------------
    #  Upstream - Backend FastAPI
    # ----------------------------------------------------------------------
    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ----------------------------------------------------------------------
    #  Résolution DNS interne (pour Docker)
    # ----------------------------------------------------------------------
    # resolver 127.0.0.11 valid=30s ipv6=off;

    # ======================================================================
    #  SERVEUR PRINCIPAL (HTTP sur port 80)
    # ======================================================================

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # ------------------------------------------------------------------
        #  Dossier racine et fichier index
        # ------------------------------------------------------------------
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # ------------------------------------------------------------------
        #  Charset
        # ------------------------------------------------------------------
        charset utf-8;
        charset_types text/css text/plain text/xml application/json application/javascript;

        # ------------------------------------------------------------------
        #  En-têtes de sécurité
        # ------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # ------------------------------------------------------------------
        #  Favicon (pas de log)
        # ------------------------------------------------------------------
        location = /favicon.ico {
            log_not_found off;
            access_log    off;
            expires       30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location = /favicon.svg {
            log_not_found off;
            access_log    off;
            expires       30d;
            add_header Cache-Control "public, max-age=2592000";
            types         { image/svg+xml svg; }
        }

        location = /robots.txt {
            log_not_found off;
            access_log    off;
        }

        # ------------------------------------------------------------------
        #  Manifest PWA
        # ------------------------------------------------------------------
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        location = /browserconfig.xml {
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ------------------------------------------------------------------
        #  Icônes PWA
        # ------------------------------------------------------------------
        location ^~ /icons/ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        #  Assets statiques (JS, CSS, images, fonts)
        # ------------------------------------------------------------------
        location ~* ^/assets/.*\.(js|mjs|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        #  Fichiers JSON, XML, TXT dans assets
        # ------------------------------------------------------------------
        location ~* ^/assets/.*\.(json|xml|txt)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        #  Service Worker (PWA)
        # ------------------------------------------------------------------
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            access_log off;
        }

        location = /workbox-*.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            access_log off;
        }

        # ------------------------------------------------------------------
        #  Healthcheck (utilisé par Docker)
        # ------------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ------------------------------------------------------------------
        #  API Backend - Proxy
        # ------------------------------------------------------------------
        location ^~ /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=50 nodelay;

            # Proxy vers backend
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;

            # Timeouts étendus (téléchargements longs)
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # Buffers
            proxy_buffering       off;
            proxy_buffer_size     128k;
            proxy_buffers         4 256k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;

            # En-têtes de réponse
            proxy_hide_header X-Powered-By;
        }

        # ------------------------------------------------------------------
        #  Documentation API - Swagger UI
        # ------------------------------------------------------------------
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/ {
            proxy_pass http://backend/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        #  Documentation API - ReDoc
        # ------------------------------------------------------------------
        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc/ {
            proxy_pass http://backend/redoc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        #  OpenAPI Schema
        # ------------------------------------------------------------------
        location = /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        #  WebSocket - Mises à jour temps réel
        # ------------------------------------------------------------------
        location ^~ /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts longs pour les WebSockets
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # Pas de buffering pour les WebSockets
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        #  Healthcheck backend (utilisé par le proxy)
        # ------------------------------------------------------------------
        location = /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # ------------------------------------------------------------------
        #  Fichiers statiques supplémentaires (uploads, etc.)
        # ------------------------------------------------------------------
        location ^~ /static/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        #  SPA Fallback - Toutes les autres routes
        # ------------------------------------------------------------------
        location / {
            # Rate limiting
            limit_req zone=general_limit burst=200 nodelay;

            # Rediriger toutes les routes vers index.html (Vue Router)
            try_files $uri $uri/ /index.html;

            # Pas de cache pour index.html
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ------------------------------------------------------------------
        #  Gestion des erreurs
        # ------------------------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ------------------------------------------------------------------
        #  Bloquer les fichiers sensibles
        # ------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|gitignore|htaccess|htpasswd|config|bak|sql|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ======================================================================
    #  SERVEUR HTTPS (exemple - décommenter en production avec certificats)
    # ======================================================================
    # server {
    #     listen       443 ssl http2;
    #     listen       [::]:443 ssl http2;
    #     server_name  votre-domaine.com;
    #
    #     # Certificats SSL
    #     ssl_certificate     /etc/nginx/ssl/nexusdl.crt;
    #     ssl_certificate_key /etc/nginx/ssl/nexusdl.key;
    #
    #     # Paramètres SSL optimisés
    #     ssl_session_cache    shared:SSL:10m;
    #     ssl_session_timeout  10m;
    #     ssl_session_tickets  off;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_ciphers          'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # Redirection HTTP vers HTTPS
    #     # (Configurer un serveur séparé sur port 80 qui redirige vers 443)
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     # ... (copier les mêmes locations que le serveur HTTP)
    # }

    # ======================================================================
    #  SERVEUR DE REDIRECTION HTTP vers HTTPS (si HTTPS activé)
    # ======================================================================
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name votre-domaine.com;
    #     return 301 https://$host$request_uri;
    # }

    # ----------------------------------------------------------------------
    #  Inclusion des fichiers de configuration supplémentaires
    # ----------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
