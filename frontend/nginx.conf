# ==========================================================================
#  NexusDL 2.0 - Nginx Configuration (version complète et finale)
#  Fichier : frontend/nginx.conf
#  Description : Configuration Nginx pour servir l'application Vue.js 3
#                et proxy vers le backend FastAPI. Optimisée pour la
#                production, Docker et Render.com.
#  Version : 2.0.0
# ==========================================================================

# --------------------------------------------------------------------------
#  Configuration globale
# --------------------------------------------------------------------------

# Utilisateur et groupe (défini dans l'image alpine)
user  nginx;

# Nombre de workers (auto = nombre de CPU disponibles)
worker_processes  auto;

# Fichier PID
pid  /var/run/nginx.pid;

# Log d'erreur global
error_log  /var/log/nginx/error.log  warn;

# --------------------------------------------------------------------------
#  Événements
# --------------------------------------------------------------------------

events {
    # Nombre maximum de connexions simultanées par worker
    worker_connections  2048;

    # Accepter plusieurs connexions à la fois
    multi_accept        on;

    # Méthode d'I/O efficace sous Linux
    use                 epoll;
}

# --------------------------------------------------------------------------
#  HTTP
# --------------------------------------------------------------------------

http {
    # ======================================================================
    #  TYPES MIME
    # ======================================================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ======================================================================
    #  FORMATS DE LOG
    # ======================================================================

    # --- Format classique ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # --- Format JSON (pour parsing par des outils de monitoring) ---
    log_format json_combined escape=json
        '{'
          '"time_local":"$time_local",'
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"request":"$request",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"http_referrer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    # ======================================================================
    #  LOGS D'ACCÈS
    # ======================================================================
    access_log  /var/log/nginx/access.log  main  buffer=32k flush=5s;

    # ======================================================================
    #  PARAMÈTRES DE PERFORMANCE
    # ======================================================================
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  100;
    client_body_timeout     60s;
    client_header_timeout   60s;
    send_timeout            60s;

    # Masquer la version de Nginx dans les en-têtes
    server_tokens           off;

    # ======================================================================
    #  LIMITES DE TAILLE
    # ======================================================================
    client_max_body_size        100M;      # Pour les uploads de CBZ
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    # ======================================================================
    #  CACHE DES FICHIERS STATIQUES
    # ======================================================================
    open_file_cache          max=2000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ======================================================================
    #  COMPRESSION GZIP
    # ======================================================================
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        application/font-woff
        application/font-woff2
        image/svg+xml
        image/x-icon
        font/opentype
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ======================================================================
    #  COMPRESSION BROTLI (si module compilé)
    #  Activable si le module brotli est installé dans l'image.
    #  Sur l'image alpine par défaut, ce module n'est PAS disponible.
    # ======================================================================
    # brotli              on;
    # brotli_comp_level   6;
    # brotli_static       on;
    # brotli_types        text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ======================================================================
    #  CACHE PROXY (pour les assets, si activé)
    # ======================================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    # ======================================================================
    #  RATE LIMITING
    # ======================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ======================================================================
    #  UPSTREAM - BACKEND FASTAPI
    # ======================================================================
    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ======================================================================
    #  SERVEUR PRINCIPAL (HTTP sur port 80)
    # ======================================================================

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # ==================================================================
        #  DOSSIER RACINE ET INDEX
        # ==================================================================
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # ==================================================================
        #  CHARSET
        # ==================================================================
        charset utf-8;
        charset_types text/css text/plain text/xml application/json application/javascript;

        # ==================================================================
        #  EN-TÊTES DE SÉCURITÉ
        # ==================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # ==================================================================
        #  FAVICON & ICONS
        # ==================================================================
        location = /favicon.ico {
            log_not_found off;
            access_log    off;
            expires       30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        location = /favicon.svg {
            log_not_found off;
            access_log    off;
            expires       30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Content-Type image/svg+xml;
            try_files $uri =404;
        }

        location = /robots.txt {
            log_not_found off;
            access_log    off;
            try_files $uri =404;
        }

        location ^~ /icons/ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
            try_files $uri =404;
        }

        # ==================================================================
        #  MANIFEST PWA
        # ==================================================================
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type application/manifest+json;
            access_log off;
            try_files $uri =404;
        }

        location = /browserconfig.xml {
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            try_files $uri =404;
        }

        # ==================================================================
        #  SERVICE WORKER (PWA) - Ne jamais mettre en cache
        # ==================================================================
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            access_log off;
            try_files $uri =404;
        }

        location ~* ^/workbox-.*\.js$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            access_log off;
            try_files $uri =404;
        }

        # ==================================================================
        #  ASSETS STATIQUES (JS, CSS, images, fonts) - Cache long
        # ==================================================================
        location ~* ^/assets/.*\.(js|mjs|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # ==================================================================
        #  FICHIERS JSON/XML/TXT dans assets - Cache court
        # ==================================================================
        location ~* ^/assets/.*\.(json|xml|txt)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # ==================================================================
        #  HEALTHCHECK (utilisé par Docker et Render)
        # ==================================================================
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ==================================================================
        #  API BACKEND - Proxy vers FastAPI
        # ==================================================================
        location ^~ /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 20;

            # Proxy vers backend
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;

            # Timeouts étendus (téléchargements longs)
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # Pas de buffering pour les longs téléchargements
            proxy_buffering       off;
            proxy_buffer_size     128k;
            proxy_buffers         4 256k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;

            # Cacher les en-têtes du backend
            proxy_hide_header X-Powered-By;
        }

        # ==================================================================
        #  DOCUMENTATION API - Swagger UI
        # ==================================================================
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/ {
            proxy_pass http://backend/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        #  DOCUMENTATION API - ReDoc
        # ==================================================================
        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc/ {
            proxy_pass http://backend/redoc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        #  OPENAPI SCHEMA
        # ==================================================================
        location = /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        #  WEBSOCKET - Mises à jour temps réel
        # ==================================================================
        location ^~ /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts longs pour les WebSockets
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # Pas de buffering pour les WebSockets
            proxy_buffering off;
        }

        # ==================================================================
        #  HEALTHCHECK BACKEND
        # ==================================================================
        location = /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # ==================================================================
        #  FICHIERS STATIQUES SUPPLÉMENTAIRES (uploads, etc.)
        # ==================================================================
        location ^~ /static/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            try_files $uri =404;
        }

        # ==================================================================
        #  SPA FALLBACK - Toutes les autres routes
        #  Redirige vers index.html (Vue Router prend le relais)
        # ==================================================================
        location / {
            # Rate limiting
            limit_req zone=general_limit burst=200 nodelay;

            # Redirection vers index.html pour le SPA
            try_files $uri $uri/ /index.html;

            # Pas de cache pour index.html
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ==================================================================
        #  GESTION DES ERREURS
        # ==================================================================
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ==================================================================
        #  BLOCAGE DES FICHIERS SENSIBLES
        # ==================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|gitignore|htaccess|htpasswd|config|bak|sql|log|ini|conf)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ==================================================================
        #  PROTECTION CONTRE LES ATTAQUES COURANTES
        # ==================================================================
        # Bloquer les User-Agents malveillants
        if ($http_user_agent ~* (nmap|nikto|sqlmap|masscan|nessus|acunetix)) {
            return 403;
        }

        # Bloquer les requêtes suspectes
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
            return 405;
        }
    }

    # ======================================================================
    #  SERVEUR HTTPS (optionnel - décommenter en production avec certificats)
    # ======================================================================
    # server {
    #     listen       443 ssl http2;
    #     listen       [::]:443 ssl http2;
    #     server_name  votre-domaine.com;
    #
    #     # --- Certificats SSL ---
    #     ssl_certificate     /etc/nginx/ssl/nexusdl.crt;
    #     ssl_certificate_key /etc/nginx/ssl/nexusdl.key;
    #
    #     # --- Paramètres SSL optimisés ---
    #     ssl_session_cache    shared:SSL:10m;
    #     ssl_session_timeout  10m;
    #     ssl_session_tickets  off;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_ciphers          'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # --- HSTS ---
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # --- Mêmes locations que le serveur HTTP ---
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     location /api/ { proxy_pass http://backend/; }
    #     location / { try_files $uri $uri/ /index.html; }
    # }

    # ======================================================================
    #  SERVEUR DE REDIRECTION HTTP VERS HTTPS (si HTTPS activé)
    # ======================================================================
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name votre-domaine.com;
    #     return 301 https://$host$request_uri;
    # }

    # ======================================================================
    #  INCLUSION DES FICHIERS DE CONFIGURATION SUPPLÉMENTAIRES
    # ======================================================================
    include /etc/nginx/conf.d/*.conf;
}
