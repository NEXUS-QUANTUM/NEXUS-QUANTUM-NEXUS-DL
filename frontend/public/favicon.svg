<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé principal -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>

    <!-- Dégradé secondaire pour l'effet de profondeur -->
    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:0.8" />
    </linearGradient>

    <!-- Ombre portée -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Lueur -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#secondaryGrad)" />

  <!-- Cercle extérieur avec dégradé -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#mainGrad)" stroke-width="6" opacity="0.3" />

  <!-- Cercle intérieur -->
  <circle cx="256" cy="256" r="160" fill="url(#mainGrad)" filter="url(#shadow)" />

  <!-- Lettre "N" stylisée -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Barre verticale gauche -->
    <rect x="-72" y="-100" width="28" height="200" rx="6" fill="#ffffff" />
    
    <!-- Barre diagonale (forme de téléchargement) -->
    <path d="M -44 -100 L 44 100 L 44 60 L 72 60 L 72 100 L -44 -100 Z" fill="#ffffff" />
    
    <!-- Barre verticale droite -->
    <rect x="44" y="-100" width="28" height="200" rx="6" fill="#ffffff" />
    
    <!-- Petit triangle de téléchargement dans la diagonale -->
    <polygon points="-10,-30 10,-30 0,-10" fill="#00d4ff" opacity="0.8" />
    
    <!-- Détails techniques - traits horizontaux -->
    <line x1="-60" y1="-60" x2="-30" y2="-60" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="-60" y1="60" x2="-30" y2="60" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="30" y1="-60" x2="60" y2="-60" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="30" y1="60" x2="60" y2="60" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Anneau extérieur décoratif -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#mainGrad)" stroke-width="2" stroke-dasharray="10, 20" opacity="0.3" />

  <!-- Point d'accentuation en bas à droite -->
  <circle cx="400" cy="400" r="12" fill="#00d4ff" opacity="0.5" filter="url(#glow)" />
  <circle cx="400" cy="400" r="6" fill="#ffffff" opacity="0.8" />

  <!-- Points de données (effet réseau) -->
  <circle cx="120" cy="120" r="4" fill="#00d4ff" opacity="0.4" />
  <circle cx="392" cy="112" r="4" fill="#00d4ff" opacity="0.4" />
  <circle cx="112" cy="392" r="4" fill="#00d4ff" opacity="0.4" />
  
  <!-- Lignes de connexion entre les points -->
  <line x1="120" y1="120" x2="256" y2="256" stroke="#00d4ff" stroke-width="1" opacity="0.2" />
  <line x1="392" y1="112" x2="256" y2="256" stroke="#00d4ff" stroke-width="1" opacity="0.2" />
  <line x1="112" y1="392" x2="256" y2="256" stroke="#00d4ff" stroke-width="1" opacity="0.2" />
</svg>
