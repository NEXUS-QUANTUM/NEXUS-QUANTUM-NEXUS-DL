    <style>
      /* Reset minimal pour le loader */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: #0a0e1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        overflow: hidden;
      }

      /* --- LOADER PRINCIPAL --- */
      .nexus-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0a0e1a;
        z-index: 99999;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      .nexus-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* --- SPINNER --- */
      .nexus-loader__spinner {
        width: 64px;
        height: 64px;
        border: 4px solid rgba(26, 37, 56, 0.6);
        border-top-color: #00d4ff;
        border-right-color: #0066ff;
        border-radius: 50%;
        animation: nexusLoaderSpin 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        margin-bottom: 1.2rem;
        position: relative;
      }

      /* Effet de lueur autour du spinner */
      .nexus-loader__spinner::after {
        content: '';
        position: absolute;
        top: -4px;
        left: -4px;
        right: -4px;
        bottom: -4px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
        opacity: 0.4;
        animation: nexusLoaderGlow 1.8s ease-in-out infinite alternate;
      }

      @keyframes nexusLoaderSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes nexusLoaderGlow {
        0% {
          opacity: 0.2;
          transform: scale(1);
        }
        100% {
          opacity: 0.6;
          transform: scale(1.08);
        }
      }

      /* --- TEXTE DU LOGO --- */
      .nexus-loader__brand {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: linear-gradient(135deg, #00d4ff 0%, #0066ff 50%, #00d4ff 100%);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: nexusLoaderGradient 3s ease-in-out infinite;
      }

      .nexus-loader__brand-icon {
        font-size: 1.6rem;
        -webkit-text-fill-color: initial;
        filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.3));
      }

      @keyframes nexusLoaderGradient {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .nexus-loader__version {
        font-size: 0.7rem;
        color: #4a6a8a;
        margin-top: 0.3rem;
        -webkit-text-fill-color: #4a6a8a;
        font-weight: 400;
        letter-spacing: 0.08em;
      }

      .nexus-loader__sub {
        font-size: 0.8rem;
        color: #4a6a8a;
        margin-top: 0.1rem;
        -webkit-text-fill-color: #4a6a8a;
        font-weight: 300;
        letter-spacing: 0.05em;
        opacity: 0.7;
      }

      /* --- BARRE DE PROGRESSION (indicatrice de chargement) --- */
      .nexus-loader__progress {
        width: 200px;
        max-width: 70vw;
        height: 3px;
        background: rgba(26, 37, 56, 0.6);
        border-radius: 4px;
        margin-top: 1.2rem;
        overflow: hidden;
        position: relative;
      }

      .nexus-loader__progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00d4ff, #0066ff);
        border-radius: 4px;
        animation: nexusLoaderProgress 2.5s ease-in-out infinite;
        position: relative;
      }

      @keyframes nexusLoaderProgress {
        0% {
          width: 0%;
          transform: translateX(0);
        }
        20% {
          width: 25%;
        }
        50% {
          width: 55%;
        }
        80% {
          width: 80%;
        }
        100% {
          width: 100%;
        }
      }

    <script>
      /**
       * NexusDL - Gestionnaire du loader initial
       * Ce script gère l'affichage et la disparition du loader.
       * Il est exécuté avant le chargement du bundle principal.
       */

      (function() {
        'use strict';

        // Référence vers l'élément loader
        var loader = document.getElementById('nexus-loader');

        /**
         * Masque le loader avec une transition fluide
         * @param {boolean} remove - Supprime complètement l'élément après la transition
         */
        function hideLoader(remove) {
          remove = remove !== undefined ? remove : true;
          if (!loader) return;

          // Ajouter la classe 'hide' pour déclencher la transition
          loader.classList.add('hide');

          // Après la transition, supprimer l'élément du DOM
          if (remove) {
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 700);
          }
        }

        /**
         * Met à jour la progression du loader
         * @param {number} percent - Pourcentage de progression (0-100)
         */
        function updateLoaderProgress(percent) {
          var bar = document.querySelector('.nexus-loader__progress-bar');
          if (bar) {
            var clamped = Math.min(100, Math.max(0, percent));
            bar.style.width = clamped + '%';
          }
        }

        /**
         * Met à jour le texte du loader
         * @param {string} text - Nouveau texte à afficher
         */
        function updateLoaderText(text) {
          var subEl = document.querySelector('.nexus-loader__sub');
          if (subEl) {
            subEl.textContent = text || '';
          }
        }

        // Exposer les fonctions au scope global pour que main.js puisse les appeler
        window.__nexusLoader = {
          hide: hideLoader,
          progress: updateLoaderProgress,
          setText: updateLoaderText,
        };

        // Si le module principal n'arrive pas à masquer le loader (cas d'erreur),
        // on le masque après un délai de sécurité (8s)
        var fallbackTimeout = setTimeout(function() {
          hideLoader(true);
        }, 8000);

        // Annuler le timeout si la page est complètement chargée avant
        window.addEventListener('load', function() {
          clearTimeout(fallbackTimeout);
          // Le loader sera masqué par main.js après le montage de l'app
          // Mais on le masque après 3s supplémentaires si main.js ne l'a pas fait
          setTimeout(function() {
            if (loader && !loader.classList.contains('hide')) {
              hideLoader(true);
            }
          }, 3000);
        });

        // Gestion des erreurs critiques : masquer le loader en cas d'erreur JS
        window.addEventListener('error', function() {
          hideLoader(true);
        });

        console.log('🧬 NexusDL Loader initialisé');
      })();
    </script>
