      #nexus-loader.nexus-loader {

        justify-content: center;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0e1a;
        transition: opacity 0.5s ease, visibility 0.5s ease;

      }

      html.light-mode #nexus-loader.nexus-loader {

      }

      #nexus-loader.nexus-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* --- Spinner --- */
      .nexus-loader__spinner {
        width: 64px;
        height: 64px;
        border: 4px solid rgba(26, 37, 56, 0.6);
        border-top-color: #00d4ff;
        border-right-color: #0066ff;
        border-radius: 50%;
        animation: nexusLoaderSpin 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        margin-bottom: 1.2rem;
        position: relative;
      }

      .nexus-loader__spinner::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
        opacity: 0.4;
        animation: nexusLoaderGlow 1.8s ease-in-out infinite alternate;
      }

      @keyframes nexusLoaderSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes nexusLoaderGlow {
        0% {
          opacity: 0.2;
          transform: scale(1);
        }
        100% {
          opacity: 0.6;
          transform: scale(1.08);
        }
      }

      @keyframes nexusLoaderFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* --- Marque --- */
      .nexus-loader__brand {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: linear-gradient(135deg, #00d4ff 0%, #0066ff 50%, #00d4ff 100%);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: nexusLoaderGradient 3s ease-in-out infinite;
      }

      .nexus-loader__brand-icon {

      @keyframes nexusLoaderGradient {

    <!-- ====================================================================
      SECTION 16 — SCRIPT DE CONTRÔLE DU LOADER
      Placé dans le <body> APRÈS le loader pour garantir que le DOM
      est disponible au moment de l'exécution.
      ==================================================================== -->
    <script>
      (function () {
        'use strict';

        // ----------------------------------------------------------------
        //  1. Appliquer le thème initial AVANT tout rendu
        //     (évite le flash de thème incorrect — FOUC)
        // ----------------------------------------------------------------
        try {
          var savedTheme = localStorage.getItem('nexus-theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme ? savedTheme === 'dark' : prefersDark;

          document.documentElement.classList.toggle('light-mode', !isDark);
          document.documentElement.classList.toggle('dark-mode', isDark);

          // Mettre à jour la meta theme-color
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0a0e1a' : '#f4f6fa');
          }
        } catch (e) {
          // Ignore (mode privé, quota dépassé, etc.)
        }

        // ----------------------------------------------------------------
        //  2. Gestion du loader
        // ----------------------------------------------------------------
        var loader = document.getElementById('nexus-loader');

        /**
         * Masque le loader avec une transition fluide.
         * @param {boolean} [remove=true] - Supprime l'élément du DOM
         */
        function hideLoader(remove) {
          remove = remove !== undefined ? remove : true;
          if (!loader || loader.classList.contains('hide')) return;

          loader.classList.add('hide');

          if (remove) {
            setTimeout(function () {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
                loader = null;
              }
            }, 600);
          }
        }

        /**
         * Met à jour la progression du loader (0-100).
         * @param {number} percent
         */
        function updateLoaderProgress(percent) {
          var bar = document.querySelector('.nexus-loader__progress-bar');
          if (bar) {
            var clamped = Math.min(100, Math.max(0, Number(percent) || 0));
            bar.style.width = clamped + '%';
          }
        }

        /**
         * Met à jour le texte d'état du loader.
         * @param {string} text
         */
        function updateLoaderText(text) {
          var sub = document.querySelector('.nexus-loader__sub');
          if (sub && text) {
            sub.textContent = String(text);
          }
        }

        // ----------------------------------------------------------------
        //  3. Exposer l'API du loader (utilisable depuis main.js)
        // ----------------------------------------------------------------
        window.__nexusLoader = {
          hide: hideLoader,
          progress: updateLoaderProgress,
          setText: updateLoaderText
        };

        // ----------------------------------------------------------------
        //  4. Fallbacks de sécurité
        // ----------------------------------------------------------------

        // Fallback n°1 : masquer après 10 s (échec ou lenteur extrême)
        var fallbackTimeout = setTimeout(function () {
          hideLoader(true);
        }, 10000);

        // Fallback n°2 : nettoyage propre quand l'app est prête
        window.addEventListener(
          'nexus:ready',
          function () {
            clearTimeout(fallbackTimeout);
            hideLoader(true);
          },
          { once: true }
        );

        // Fallback n°3 : en cas d'erreur JS critique, masquer le loader
        window.addEventListener('error', function () {
          hideLoader(true);
        });

        // Fallback n°4 : si la page est déchargée, nettoyer
        window.addEventListener('beforeunload', function () {
          clearTimeout(fallbackTimeout);
        });

        // ----------------------------------------------------------------
        //  5. Log de démarrage (DEV uniquement)
        // ----------------------------------------------------------------
        try {
          if (
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            location.hostname.endsWith('.local')
          ) {
            console.log('%c🧬 NexusDL Loader', 'color:#00d4ff;font-weight:bold;', 'initialisé');
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>

                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('🔄 Nouvelle version disponible');
                    window.dispatchEvent(new CustomEvent('nexus:pwa-update'));
                  }
                });
              });
            })
            .catch(function (error) {
              console.warn('⚠️ Échec du Service Worker :', error);
            });
        });
      }
    </script>
