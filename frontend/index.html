      *,

        width: 100%;

        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background: #0a0e1a;
        color: #e8edf5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,

        line-height: 1.6;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;

      html.light-mode,

        background: #f4f6fa;
        color: #1a1a2e;
      }

      #nexus-loader.nexus-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0e1a;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        animation: nexusLoaderFadeIn 0.3s ease;
      }

      html.light-mode #nexus-loader.nexus-loader {
        background: #f4f6fa;
      }

      #nexus-loader.nexus-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .nexus-loader__spinner {
        width: 64px;
        height: 64px;
        border: 4px solid rgba(26, 37, 56, 0.6);
        border-top-color: #00d4ff;
        border-right-color: #0066ff;
        border-radius: 50%;
        animation: nexusLoaderSpin 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        margin-bottom: 1.2rem;
        position: relative;
      }

      .nexus-loader__spinner::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
        opacity: 0.4;
        animation: nexusLoaderGlow 1.8s ease-in-out infinite alternate;
      }

      @keyframes nexusLoaderSpin {
        to { transform: rotate(360deg); }
      }

      @keyframes nexusLoaderGlow {
        0% { opacity: 0.2; transform: scale(1); }
        100% { opacity: 0.6; transform: scale(1.08); }
      }

      @keyframes nexusLoaderFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .nexus-loader__brand {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: linear-gradient(135deg, #00d4ff 0%, #0066ff 50%, #00d4ff 100%);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: nexusLoaderGradient 3s ease-in-out infinite;
      }

      .nexus-loader__brand-icon {
        font-size: 1.6rem;
        -webkit-text-fill-color: initial;
        filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.3));
      }

      @keyframes nexusLoaderGradient {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      .nexus-loader__version {
        font-size: 0.7rem;
        color: #4a6a8a;
        margin-top: 0.3rem;
        font-weight: 400;
        letter-spacing: 0.08em;

      .nexus-loader__sub {
        font-size: 0.8rem;

    <!-- ====================================================================
      SECTION 14 — SCRIPT DE CONTRÔLE DU LOADER
      ==================================================================== -->
    <script>
      (function () {
        'use strict';

        // 1. Appliquer le thème initial AVANT tout rendu
        try {
          var savedTheme = localStorage.getItem('nexus-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme ? savedTheme === 'dark' : prefersDark;

          document.documentElement.classList.toggle('light-mode', !isDark);
          document.documentElement.classList.toggle('dark-mode', isDark);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0a0e1a' : '#f4f6fa');
          }
        } catch (e) {
          // Ignore
        }

        // 2. Gestion du loader
        var loader = document.getElementById('nexus-loader');

        function hideLoader(remove) {
          remove = remove !== undefined ? remove : true;
          if (!loader || loader.classList.contains('hide')) return;
          loader.classList.add('hide');
          if (remove) {
            setTimeout(function () {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
                loader = null;
              }
            }, 600);
          }
        }

        function updateLoaderProgress(percent) {
          var bar = document.querySelector('.nexus-loader__progress-bar');
          if (bar) {
            var clamped = Math.min(100, Math.max(0, Number(percent) || 0));
            bar.style.width = clamped + '%';
          }
        }

        function updateLoaderText(text) {
          var sub = document.querySelector('.nexus-loader__sub');
          if (sub && text) {
            sub.textContent = String(text);
          }
        }

        // 3. Exposer l'API du loader
        window.__nexusLoader = {
          hide: hideLoader,
          progress: updateLoaderProgress,
          setText: updateLoaderText,
        };

        // 4. Fallbacks de sécurité
        var fallbackTimeout = setTimeout(function () {
          hideLoader(true);
        }, 10000);

        window.addEventListener(
          'nexus:ready',
          function () {
            clearTimeout(fallbackTimeout);
            hideLoader(true);
          },
          { once: true }
        );

        window.addEventListener('error', function () {
          hideLoader(true);
        });

        window.addEventListener('beforeunload', function () {
          clearTimeout(fallbackTimeout);
        });

        // 5. Log de démarrage (DEV uniquement)
        try {
          if (
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            location.hostname.endsWith('.local')
          ) {
            console.log('%c🧬 NexusDL Loader', 'color:#00d4ff;font-weight:bold;', 'initialisé');
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>

    <!-- ====================================================================
      SECTION 15 — GESTION DES ERREURS GLOBALES (AVANT VITE)
      ==================================================================== -->
    <script>
      (function () {
        'use strict';

        window.addEventListener('error', function (event) {
          if (window.__nexusLoader && typeof window.__nexusLoader.hide === 'function') {
            window.__nexusLoader.hide(true);
          }
          try {
            var host = location.hostname;
            if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local')) {
              console.error('❌ [NexusDL] Erreur globale :', event.error || event.message);
            }
          } catch (e) {}
        });

        window.addEventListener('unhandledrejection', function (event) {
          try {
            var host = location.hostname;
            if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local')) {
